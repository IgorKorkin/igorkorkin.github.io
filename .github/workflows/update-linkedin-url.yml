name: Update LinkedIn profile URL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-linkedin-url.yml

permissions:
  contents: write

jobs:
  update-linkedin-url:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update LinkedIn URL and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "https://www.linkedin.com/in/korkinigor/"
          new = "https://www.linkedin.com/in/igor-korkin/"
          count = text.count(old)
          if count == 0:
              raise SystemExit("Old LinkedIn URL was not found in index.html")
          path.write_text(text.replace(old, new), encoding="utf-8")
          print(f"Replaced {count} occurrence(s)")
          PY

          git rm .github/workflows/update-linkedin-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update LinkedIn profile URL"
          git push
